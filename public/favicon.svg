<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="128" height="128">
  <defs>
    <linearGradient id="veloraTealFav" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5EEAD4" />
      <stop offset="45%" stop-color="#14B8A6" />
      <stop offset="75%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#0F766E" />
    </linearGradient>
    <linearGradient id="veloraCyanFav" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BAE6FD" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <radialGradient id="veloraGlowFav" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5EEAD4" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0D9488" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Soft Halo -->
  <circle cx="50" cy="50" r="48" fill="url(#veloraGlowFav)" />

  <!-- Outer 3D Hexagonal Ring -->
  <polygon
    points="50,6 90,28 90,72 50,94 10,72 10,28"
    stroke="url(#veloraTealFav)"
    stroke-width="5"
    fill="#FFFFFF"
  />

  <!-- Inner Geometric Cyan Accent Polygon -->
  <polygon
    points="50,15 82,33 82,67 50,85 18,67 18,33"
    stroke="url(#veloraCyanFav)"
    stroke-width="2.5"
    fill="none"
    opacity="0.85"
  />

  <!-- Dynamic Stylized 'V' Monogram -->
  <path
    d="M32 31 L50 71 L68 31 M42 31 L50 49 L58 31"
    stroke="url(#veloraTealFav)"
    stroke-width="6"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Center Glowing Diamond Sparkle -->
  <polygon
    points="50,22 54,28 50,34 46,28"
    fill="#5EEAD4"
  />
</svg>
